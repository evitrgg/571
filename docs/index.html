<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>  571</title>
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בגרויות 571">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --pri:#4F46E5;--onpri:#fff;--pric:#E0E7FF;--onpric:#1E1B4B;
  --sec:#059669;--onsec:#fff;--secc:#D1FAE5;--onsecc:#064E3B;
  --bg:#F7F7FB;--on:#14142B;--sur:#fff;--sv:#ECEBF5;--onsv:#5B5B75;--out:#C3C2D6;--outv:#E3E2EF;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --pri:#A5B4FC;--onpri:#1E1B4B;--pric:#312E81;--onpric:#E0E7FF;
  --sec:#34D399;--onsec:#022C22;--secc:#064E3B;--onsecc:#D1FAE5;
  --bg:#0F0F17;--on:#EDEDF7;--sur:#181824;--sv:#262636;--onsv:#B4B4CC;--out:#4B4B63;--outv:#33334A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--on);
  font:16px/1.4 var(--font);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#root{position:fixed;inset:0}
.layer{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  animation:inL .26s cubic-bezier(.2,.8,.2,1)}
.layer.out{animation:outL .22s ease forwards}
@keyframes inL{from{transform:translateX(-28%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{to{transform:translateX(-28%);opacity:0}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px calc(24px + var(--sab));display:flex;flex-direction:column;gap:10px}
.scroll>*{flex-shrink:0}
.bar{display:flex;align-items:center;gap:4px;padding:calc(6px + var(--sat)) 6px 6px;background:var(--bg)}
.bar .t{flex:1;min-width:0}
.bar h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--onsv)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--sv)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border-radius:28px;padding:calc(14px + var(--sat)) 20px 20px;margin:calc(-16px - var(--sat)) -16px 0;border-radius:0 0 28px 28px}
.hero .row{display:flex;align-items:center}
.hero h1{margin:0;flex:1;font-size:22px;font-weight:700}
.hero .ib{color:#fff}
.hero .big{display:flex;align-items:center;gap:18px;margin-top:8px}
.hero .big b{font-size:24px;font-weight:700;display:block}
.hero .dim{opacity:.85}
.ring{position:relative;display:grid;place-items:center;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{position:relative;font-weight:700}
.seg{display:flex;background:var(--sv);border-radius:16px;padding:4px}
.seg button{flex:1;border-radius:12px;padding:8px 0;color:var(--onsv);font-weight:500;display:flex;flex-direction:column;align-items:center}
.seg button small{font-size:11px}
.seg button.on{background:var(--sur);color:var(--pri);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{font-size:16px;font-weight:600;margin:6px 0 0}
.card{background:var(--sur);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.07);display:block;width:100%;text-align:start;transition:transform .12s}
.card:active{transform:scale(.985)}
.card.done{background:var(--secc);color:var(--onsecc)}
.card.big{border-radius:24px;padding:16px}
.flex{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pb{height:8px;border-radius:99px;background:var(--sv);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;border-radius:99px;transition:width .4s}
.xs{font-size:11.5px;color:var(--onsv);margin-top:4px}
.badge{border-radius:14px;padding:8px 12px;background:var(--pric);color:var(--onpric);text-align:center;font-weight:700;min-width:58px}
.badge small{display:block;font-size:11px;font-weight:400}
.badge.ok{background:var(--secc);color:var(--onsecc)}
.pill{border-radius:99px;padding:8px 14px;background:var(--sv);color:var(--onsv);font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--pri);color:var(--onpri)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 12px 2px;flex-shrink:0}
.pills::-webkit-scrollbar{display:none}
.dn{border:1.5px solid var(--out);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.dn.on{background:var(--sec);border-color:var(--sec);color:var(--onsec)}
.card.done .dn{border-color:var(--sec)}
.btn{border-radius:99px;padding:11px 18px;font-weight:600;background:var(--pri);color:var(--onpri);text-align:center}
.btn.ok{background:var(--sec);color:var(--onsec)}
.btn.ol{background:none;color:var(--pri);border:1.5px solid var(--out);font-weight:500}
.btn.tx{background:none;color:var(--pri);padding:10px 12px}
.btn:disabled{opacity:.38}
.btn:active:not(:disabled){filter:brightness(.92)}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;padding:10px 6px;font-size:14px}
.stripe{width:5px;height:36px;border-radius:99px;flex-shrink:0}
.empty{text-align:center;color:var(--onsv);padding:24px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.layer.sheetL{background:transparent;justify-content:flex-end;animation:none}
.layer.sheetL.out .scrim{animation:fadeO .22s forwards}
@keyframes fadeO{to{opacity:0}}
.sheet{position:relative;background:var(--sur);border-radius:28px 28px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
.layer.out .sheet{animation:down .22s ease forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--out);margin:10px auto 6px;flex-shrink:0}
.sheet .in{overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.sheet .in>*{flex-shrink:0}
.qrow{display:flex;align-items:center;gap:10px;background:var(--sv);border-radius:14px;padding:12px 14px;width:100%;text-align:start}
.dlg{position:relative;margin:auto 24px;background:var(--sur);border-radius:28px;padding:22px 20px 14px;display:flex;flex-direction:column;gap:10px;animation:pop .2s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.layer.dlgL{background:transparent;justify-content:center;animation:none}
.layer.dlgL.out .scrim{animation:fadeO .2s forwards}
.dlg h3{margin:0 0 2px;font-size:19px;font-weight:600}
.dlg .acts{display:flex;justify-content:flex-start;gap:4px;margin-top:4px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--onsv)}
.fld input,.fld textarea{border:1.5px solid var(--out);background:transparent;border-radius:12px;padding:11px 12px;font-size:16px;width:100%;outline:none;direction:ltr;text-align:left}
.fld textarea{direction:rtl;text-align:start;min-height:96px;resize:vertical}
.fld input.h{direction:rtl;text-align:start}
.fld input:focus,.fld textarea:focus{border-color:var(--pri)}
/* viewer */
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center;background:var(--bg)}
.stage canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);transform-origin:center center;will-change:transform}
.stage .msg{padding:24px;text-align:center;color:var(--onsv);display:flex;flex-direction:column;gap:10px;align-items:center;white-space:pre-line}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--sv);border-top-color:var(--pri);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vctl{display:flex;align-items:center;gap:8px;padding:6px 8px}
.hint{font-size:12.5px;color:var(--onsv);padding:2px 16px}
.vfoot{padding:0 8px calc(8px + var(--sab));display:flex;gap:8px}
.vfoot .btn{padding:11px 14px;font-size:14.5px}
.vfoot .btn:first-child{flex:1}
.vctl .btn{padding:8px 14px;font-size:14px}
.zoomL{background:#000}
.zoomL img{flex:1;min-height:0;width:100%;object-fit:contain;touch-action:none;transform-origin:center}
.zoomL .x{position:absolute;top:calc(8px + var(--sat));inset-inline-start:8px;color:#fff;z-index:2;font-weight:600;padding:10px 14px}
.thumb{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:var(--sv)}
.install{background:var(--pric);color:var(--onpric);border-radius:18px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:#222;color:#fff;border-radius:99px;padding:10px 18px;font-size:14px;z-index:99;animation:fade .2s;max-width:88%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
